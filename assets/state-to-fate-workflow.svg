<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
<title id="t">VitraCell state-to-fate workflow</title><desc id="d">Conceptual diagram linking one identified living cell from baseline through perturbation and repeated measurements to fate and optional molecular characterization.</desc>
<defs><linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#07151c"/><stop offset="1" stop-color="#103746"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".18"/></filter></defs>
<rect width="1200" height="520" rx="28" fill="url(#bg)"/>
<text x="72" y="74" fill="#67d7df" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2">FROM CELL STATE TO CELL FATE</text>
<text x="72" y="118" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="700">Preserve the identity of the original living cell through the experiment.</text>
<g font-family="Arial,sans-serif">
  <g filter="url(#s)"><rect x="72" y="190" width="180" height="170" rx="20" fill="#fff"/><circle cx="162" cy="246" r="28" fill="#d8f3f5" stroke="#198f9a" stroke-width="3"/><text x="162" y="311" text-anchor="middle" fill="#09232d" font-size="20" font-weight="700">Baseline</text><text x="162" y="337" text-anchor="middle" fill="#57727b" font-size="14">original cell state</text></g>
  <path d="M270 275h70" stroke="#67d7df" stroke-width="4" stroke-linecap="round"/><path d="M329 265l14 10-14 10" fill="none" stroke="#67d7df" stroke-width="4"/>
  <g filter="url(#s)"><rect x="360" y="190" width="180" height="170" rx="20" fill="#fff"/><path d="M418 244h64M450 212v64" stroke="#c46146" stroke-width="5" stroke-linecap="round"/><text x="450" y="311" text-anchor="middle" fill="#09232d" font-size="20" font-weight="700">Perturbation</text><text x="450" y="337" text-anchor="middle" fill="#57727b" font-size="14">defined treatment</text></g>
  <path d="M558 275h70" stroke="#67d7df" stroke-width="4" stroke-linecap="round"/><path d="M617 265l14 10-14 10" fill="none" stroke="#67d7df" stroke-width="4"/>
  <g filter="url(#s)"><rect x="648" y="168" width="220" height="214" rx="20" fill="#fff"/><polyline points="690,278 725,250 760,287 800,225 832,245" fill="none" stroke="#198f9a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="690" cy="278" r="6" fill="#198f9a"/><circle cx="725" cy="250" r="6" fill="#198f9a"/><circle cx="760" cy="287" r="6" fill="#198f9a"/><circle cx="800" cy="225" r="6" fill="#198f9a"/><circle cx="832" cy="245" r="6" fill="#198f9a"/><text x="758" y="323" text-anchor="middle" fill="#09232d" font-size="20" font-weight="700">Same-cell history</text><text x="758" y="349" text-anchor="middle" fill="#57727b" font-size="14">repeated early observations</text></g>
  <path d="M886 275h70" stroke="#67d7df" stroke-width="4" stroke-linecap="round"/><path d="M945 265l14 10-14 10" fill="none" stroke="#67d7df" stroke-width="4"/>
  <g filter="url(#s)"><rect x="976" y="190" width="152" height="170" rx="20" fill="#fff"/><circle cx="1026" cy="250" r="20" fill="#dff5e8" stroke="#2e8b57" stroke-width="3"/><path d="M1016 250l8 8 14-18" fill="none" stroke="#2e8b57" stroke-width="4" stroke-linecap="round"/><circle cx="1080" cy="250" r="20" fill="#f7e3df" stroke="#b65743" stroke-width="3"/><path d="M1070 240l20 20M1090 240l-20 20" stroke="#b65743" stroke-width="4" stroke-linecap="round"/><text x="1052" y="311" text-anchor="middle" fill="#09232d" font-size="20" font-weight="700">Fate</text><text x="1052" y="337" text-anchor="middle" fill="#57727b" font-size="14">survive · recover · die</text></g>
  <rect x="648" y="415" width="480" height="54" rx="14" fill="#0f2c37" stroke="#2e5c68"/><text x="888" y="448" text-anchor="middle" fill="#d9eef1" font-size="16">Optional terminal molecular characterization links biology back to the same record.</text>
</g>
</svg>